[package]
name = "projectd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
uuid.workspace = true
serde_json.workspace = true
tokio.workspace = true
clap.workspace = true
axum.workspace = true
# Already locked through axum; named here for the bounded connection path.
hyper = { version = "=1.11.1", features = ["http1", "server"] }
hyper-util = { version = "=0.1.20", features = ["tokio"] }
tower-service = "=0.3.3"
url.workspace = true
async-stream.workspace = true
rustix.workspace = true
project-application = { path = "../application" }
project-store = { path = "../project-store" }
notify = "=8.2.0"
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend", "runtime_detection"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "=5.13.2", default-features = false, features = ["tokio"] }
futures-util = "=0.3.34"

[dev-dependencies]
reqwest.workspace = true
rusqlite.workspace = true
tempfile.workspace = true

[lints]
workspace = true
