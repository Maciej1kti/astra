[workspace]
members = ["crates/domain", "crates/project-store"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
publish = false

[workspace.dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
chrono = { version = "=0.4.44", default-features = false, features = ["std"] }
jsonschema = { version = "=0.52.0", default-features = false }
thiserror = "=2.0.20"
saphyr-parser = "=0.0.12"
rustix = { version = "=1.1.4", features = ["fs", "process"] }
sha2 = "=0.11.0"
uuid = { version = "=1.26.0", features = ["v4", "v7", "serde"] }
tempfile = "=3.27.0"
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
