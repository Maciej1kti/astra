[workspace]
members = ["crates/domain", "crates/project-store", "crates/application", "crates/projectd", "crates/projectctl"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
publish = false

[workspace.dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
chrono = { version = "=0.4.44", default-features = false, features = ["std"] }
jsonschema = { version = "=0.52.0", default-features = false }
thiserror = "=2.0.20"
saphyr-parser = "=0.0.12"
rustix = { version = "=1.1.4", features = ["fs", "process"] }
sha2 = "=0.11.0"
uuid = { version = "=1.26.0", features = ["v4", "v7", "serde"] }
tempfile = "=3.27.0"
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
getrandom = "=0.4.3"
chrono-tz = "=0.10.4"

axum = "=0.8.9"
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
clap = { version = "=4.6.6", features = ["derive"] }
reqwest = { version = "=0.13.4", default-features = false, features = ["json", "query"] }
url = "=2.5.8"
async-stream = "=0.3.6"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
