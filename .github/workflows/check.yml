name: Verify source and package
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.11.0
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      # Downloaded crates only; build output is too large to share between runs.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-registry-${{ runner.os }}-
      - name: Install pinned toolchains and dependencies
        run: |
          rustup toolchain install 1.92.0 --profile minimal --component rustfmt --component clippy
          python -m venv .venv-check
          .venv-check/bin/pip install -r scripts/requirements-validation.lock
          npm ci
      - name: Verify contracts, tests and release build
        run: .venv-check/bin/python scripts/check.py
      - name: Install browser test runtime
        run: npx playwright install --with-deps chromium
      - name: Exercise HTTPS browser and Unix CLI
        env:
          ASTRA_TEST_PROFILE: release
        run: |
          npm run test:browser
      - name: Build host archive
        run: python scripts/package.py
      - name: Exercise packaged installation and stopped-copy recovery
        run: python scripts/release-smoke.py dist/local-projects-*.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: evidence-${{ matrix.os }}
          retention-days: 90
          path: |
            dist/*.tar.gz
            dist/*.sha256
            test-results/browser/
