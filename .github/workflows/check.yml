name: Verify source and package
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.11.0
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'
      - name: Install pinned toolchains and dependencies
        run: |
          rustup toolchain install 1.92.0 --profile minimal --component rustfmt --component clippy
          python -m venv .venv-check
          .venv-check/bin/pip install -r scripts/requirements-validation.lock
          npm ci
      # Dependency builds only; workspace crates are rebuilt on every run.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Verify contracts, tests and release build
        run: .venv-check/bin/python scripts/check.py
      - name: Install browser test runtime
        run: npx playwright install --with-deps chromium
      - name: Exercise HTTPS browser and Unix CLI
        env:
          ASTRA_TEST_PROFILE: release
        run: |
          npm run test:browser
      - name: Build host archive
        run: python scripts/package.py
      - name: Exercise packaged installation and stopped-copy recovery
        run: python scripts/release-smoke.py dist/local-projects-*.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: evidence-${{ matrix.os }}
          retention-days: 90
          path: |
            dist/*.tar.gz
            dist/*.sha256
            test-results/browser/
