name: Dependency advisory scan

on:
  schedule:
    - cron: '23 7 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - Cargo.lock
      - 'crates/**/Cargo.toml'
      - package.json
      - package-lock.json
      - 'apps/*/package.json'
      - 'scripts/requirements-validation*'
      - .github/workflows/dependencies.yml
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - 'crates/**/Cargo.toml'
      - package.json
      - package-lock.json
      - 'apps/*/package.json'
      - 'scripts/requirements-validation*'
      - .github/workflows/dependencies.yml

permissions:
  contents: read

jobs:
  advisory-scan:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
    with:
      runs-on: ubuntu-24.04
      fail-on-vuln: true
      scan-args: |-
        --no-resolve
        --lockfile=package-lock.json
        --lockfile=Cargo.lock
        --lockfile=requirements.txt:scripts/requirements-validation.lock
