          minLength: 1
          maxLength: 120
components:
  securitySchemes:
    BrowserSession:
      type: apiKey
      in: cookie
      name: __Host-project_session
  parameters:
    RequestID:
      name: X-Request-ID
      in: header
      required: true
      schema:
        $ref: '#/components/schemas/RequestID'
    CommandEpoch:
      name: X-Command-Epoch
      in: header
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
    CSRF:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 512
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        pattern: ^"r1\.[0-9a-f]{64}"$
      description: Wersja docelowego zasobu, nie *. Retry zachowuje pierwotną wartość.
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
        maxLength: 4096
    project_id:
      name: project_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
    card_id:
      name: card_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
    milestone_id:
      name: milestone_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
    update_id:
      name: update_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
    pairing_id:
      name: pairing_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
    session_id:
      name: session_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
    root_id:
      name: root_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
    job_id:
      name: job_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
    request_id:
      name: request_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/RequestID'
  schemas:
    UUID:
      type: string
      format: uuid
      pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    RequestID:
      type: string
      format: uuid
      pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    LocalDate:
      type: string
      format: date
      pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
    Instant:
      type: string
      format: date-time
      pattern: Z$
    Version:
      type: string
      pattern: ^r1\.[0-9a-f]{64}$
    Position:
      type: string
      pattern: ^[0-9a-f]{32}$
      not:
        enum:
        - '00000000000000000000000000000000'
        - ffffffffffffffffffffffffffffffff
    ExtensionValue:
      type:
      - string
      - number
      - boolean
      - 'null'
      - array
      - object
      description: 'Ograniczone JSON values; poza schema: max depth 12, 10000 nodes, brak niebezpiecznych kluczy
        prototypu w obiektach JS.'
    Schedule:
      type: object
      properties:
        start:
          $ref: '#/components/schemas/LocalDate'
        end:
          $ref: '#/components/schemas/LocalDate'
      required:
      - start
      - end
      additionalProperties: false
    Due:
      type: object
      properties:
        date:
          $ref: '#/components/schemas/LocalDate'
        kind:
          type: string
          enum:
          - hard
          - target
      required:
      - date
      - kind
      additionalProperties: false
    Blocked:
      type: object
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 1000
      required:
      - reason
      additionalProperties: false
    Author:
      type: object
      properties:
        kind:
          type: string
          enum:
          - human
          - agent
        label:
          type: string
          minLength: 1
          maxLength: 120
        session_id:
          type: string
          minLength: 1
          maxLength: 128
      required:
      - kind
      - label
      additionalProperties: false
    Target:
      type: object
      properties:
        type:
          type: string
          enum:
          - project
          - card
          - milestone
        id:
          $ref: '#/components/schemas/UUID'
      required:
      - type
      - id
      additionalProperties: false
    Evidence:
      oneOf:
      - type: object
        properties:
          type:
            const: url
          value:
            type: string
            format: uri
            pattern: ^https?://
            maxLength: 2048
          label:
            type: string
            minLength: 1
            maxLength: 240
        required:
        - type
        - value
        additionalProperties: false
      - type: object
        properties:
          type:
            const: commit
          value:
            type: string
            pattern: ^[0-9a-f]{7,64}$
          label:
            type: string
            minLength: 1
            maxLength: 240
        required:
        - type
        - value
        additionalProperties: false
      - type: object
        properties:
          type:
            const: path
          value:
            type: string
            minLength: 1
            maxLength: 1024
          label:
            type: string
            minLength: 1
            maxLength: 240
        required:
        - type
        - value
        additionalProperties: false
    ProjectMetadata:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        created_at:
          $ref: '#/components/schemas/Instant'
        updated_at:
          $ref: '#/components/schemas/Instant'
        schema_version:
          const: 1
        name:
          type: string
          minLength: 1
          maxLength: 120
        state:
          type: string
          enum:
          - active
          - paused
          - archived
        phase:
          type: string
          minLength: 1
          maxLength: 200
        review_on:
          $ref: '#/components/schemas/LocalDate'
      required:
      - schema_version
      - id
      - name
      - state
      - created_at
      - updated_at
      additionalProperties: false
      patternProperties:
        ^x-[a-z0-9][a-z0-9_.-]{0,62}$:
          $ref: '#/components/schemas/ExtensionValue'
    CardMetadata:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        created_at:
          $ref: '#/components/schemas/Instant'
        updated_at:
          $ref: '#/components/schemas/Instant'
        title:
          type: string
          minLength: 1
          maxLength: 240
        kind:
          type: string
          enum:
          - outcome
          - decision
        status:
          type: string
          enum:
          - planned
          - active
          - review
          - done
          - cancelled
        priority:
          type: string
          enum:
          - low
          - normal
          - high
          - urgent
        position:
          $ref: '#/components/schemas/Position'
        archived:
          type: boolean
        schedule:
          $ref: '#/components/schemas/Schedule'
        due:
          $ref: '#/components/schemas/Due'
        review_on:
          $ref: '#/components/schemas/LocalDate'
        milestone_id:
          $ref: '#/components/schemas/UUID'
        blocked:
          $ref: '#/components/schemas/Blocked'
        depends_on:
          type: array
          items:
            $ref: '#/components/schemas/UUID'
          maxItems: 100
          uniqueItems: true
        labels:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 48
          maxItems: 20
          uniqueItems: true
      required:
      - id
      - title
      - kind
      - status
      - priority
      - position
      - archived
      - created_at
      - updated_at
      additionalProperties: false
      patternProperties:
        ^x-[a-z0-9][a-z0-9_.-]{0,62}$:
          $ref: '#/components/schemas/ExtensionValue'
    MilestoneMetadata:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        created_at:
          $ref: '#/components/schemas/Instant'
        updated_at:
          $ref: '#/components/schemas/Instant'
        title:
          type: string
          minLength: 1
          maxLength: 240
        status:
          type: string
          enum:
          - planned
          - active
          - achieved
          - cancelled
        position:
          $ref: '#/components/schemas/Position'
        archived:
          type: boolean
        due:
          $ref: '#/components/schemas/Due'
      required:
      - id
      - title
      - status
      - position
      - archived
      - created_at
      - updated_at
      additionalProperties: false
      patternProperties:
        ^x-[a-z0-9][a-z0-9_.-]{0,62}$:
          $ref: '#/components/schemas/ExtensionValue'
    UpdateMetadata:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        kind:
          type: string
          enum:
          - result
          - blocker
          - decision_needed
          - note
          - correction
          - resolution
        target:
          $ref: '#/components/schemas/Target'
        summary:
          type: string
          minLength: 1
