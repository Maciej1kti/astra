          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SummaryPage'
        default:
          description: Kontrolowany błąd; szczegóły w katalogu kodów
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
  /api/v1/projects/{project_id}:
    get:
      operationId: getProject
      tags:
      - projects
      summary: getProject
      description: ''
      responses:
        '200':
          description: Poprawna odpowiedź
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResource'
          headers:
            ETag:
              schema:
                type: string
              description: Silny validator targetu
        default:
          description: Kontrolowany błąd; szczegóły w katalogu kodów
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - $ref: '#/components/parameters/project_id'
    patch:
      operationId: patchProject
      tags:
      - projects
      summary: patchProject
      description: ''
      responses:
        '200':
          description: Poprawna odpowiedź
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResponse'
        default:
          description: Kontrolowany błąd; szczegóły w katalogu kodów
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409': *id001
        '412': &id006
          description: Niezgodna wersja
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '428': &id007
          description: Brak precondition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '410': *id002
        '422': *id003
        '503': *id004
        '507': *id005
      parameters:
      - $ref: '#/components/parameters/project_id'
      - $ref: '#/components/parameters/RequestID'
      - $ref: '#/components/parameters/CommandEpoch'
      - $ref: '#/components/parameters/CSRF'
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectPatch'
  /api/v1/projects/{project_id}/context:
    get:
      operationId: getAgentContext
      tags:
      - projects
      summary: getAgentContext
      description: ''
      responses:
        '200':
          description: Poprawna odpowiedź
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Context'
        default:
          description: Kontrolowany błąd; szczegóły w katalogu kodów
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - $ref: '#/components/parameters/project_id'
      - name: max_bytes
        in: query
        schema:
          type: integer
          minimum: 4096
          maximum: 131072
          default: 24576
  /api/v1/projects/{project_id}/history:
    get:
      operationId: getProjectHistory
      tags:
      - history
      summary: getProjectHistory
      description: ''
      responses:
        '200':
          description: Poprawna odpowiedź
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoryPage'
        default:
          description: Kontrolowany błąd; szczegóły w katalogu kodów
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - $ref: '#/components/parameters/project_id'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
  /api/v1/registrations/{project_id}:
    get:
      operationId: getRegistration
      tags:
      - registration
      summary: getRegistration
      description: ''
      responses:
        '200':
          description: Poprawna odpowiedź
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationResource'
          headers:
            ETag:
              schema:
                type: string
              description: Silny validator targetu
        default:
          description: Kontrolowany błąd; szczegóły w katalogu kodów
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - $ref: '#/components/parameters/project_id'
    delete:
      operationId: unregisterProject
      tags:
      - registration
      summary: unregisterProject
      description: Usuwa wyłącznie wpis workspace. Nigdy nie usuwa folderu, .project ani AGENTS.
      responses:
        '200':
          description: Poprawna odpowiedź
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResponse'
        default:
          description: Kontrolowany błąd; szczegóły w katalogu kodów
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409': *id001
        '412': *id006
        '428': *id007
        '410': *id002
        '422': *id003
        '503': *id004
        '507': *id005
      parameters:
      - $ref: '#/components/parameters/project_id'
      - $ref: '#/components/parameters/RequestID'
      - $ref: '#/components/parameters/CommandEpoch'
      - $ref: '#/components/parameters/CSRF'
      - $ref: '#/components/parameters/IfMatch'
  /api/v1/projects/{project_id}/cards:
