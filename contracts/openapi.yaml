openapi: 3.1.1
info:
  title: Local Projects HTTP API
  version: 1.0.0
  description: Normatywny kontrakt handoffu, nie spec wygenerowana z istniejącego serwera. Semantyka w docs/05,
    trwałość w docs/04. Admin lokalny w contracts/local-ipc.json.
servers:
- url: /
security:
- BrowserSession: []
paths:
  /healthz:
    get:
      operationId: health
      tags:
      - system
      summary: health
      description: Implementacja publicznej odpowiedzi MUST ograniczyć treść do minimalnej gotowości; pełna diagnostyka
        ma osobny endpoint.
      responses:
        '200':
          description: Poprawna odpowiedź
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        default:
          description: Kontrolowany błąd; szczegóły w katalogu kodów
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security: []
  /api/v1/bootstrap:
    get:
      operationId: getBootstrap
      tags:
      - system
      summary: getBootstrap
      description: ''
      responses:
        '200':
          description: Poprawna odpowiedź
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bootstrap'
        default:
          description: Kontrolowany błąd; szczegóły w katalogu kodów
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/diagnostics:
    get:
      operationId: getDiagnostics
      tags:
      - system
      summary: getDiagnostics
      description: ''
      responses:
        '200':
          description: Poprawna odpowiedź
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Diagnostics'
        default:
          description: Kontrolowany błąd; szczegóły w katalogu kodów
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/auth/pairings:
    post:
      operationId: createPairing
      tags:
      - auth
      summary: createPairing
      description: Same-origin + rate limit; ustawia pending HttpOnly cookie. Nie wymaga zaufanej sesji.
      responses:
        '201':
          description: Poprawna odpowiedź
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pairing'
        default:
          description: Kontrolowany błąd; szczegóły w katalogu kodów
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PairingCreate'
      security: []
    get:
      operationId: listPendingPairings
      tags:
      - auth
      summary: listPendingPairings
      description: ''
      responses:
        '200':
          description: Poprawna odpowiedź
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PairingPage'
        default:
          description: Kontrolowany błąd; szczegóły w katalogu kodów
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/auth/pairings/current:
    get:
      operationId: getCurrentPairing
      tags:
      - auth
      summary: getCurrentPairing
      description: Wymaga poprawnego pending cookie, nie zaufanej sesji. Nigdy nie zwraca pairing innego klienta.
      responses:
        '200':
          description: Poprawna odpowiedź
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pairing'
        default:
          description: Kontrolowany błąd; szczegóły w katalogu kodów
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security: []
  /api/v1/auth/pairings/claim:
    post:
      operationId: claimPairing
      tags:
      - auth
      summary: claimPairing
      description: Pending cookie i pending CSRF + Origin; kontrolowany exchange/grace według security spec.
      responses:
        '200':
          description: Poprawna odpowiedź
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        default:
          description: Kontrolowany błąd; szczegóły w katalogu kodów
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - $ref: '#/components/parameters/CSRF'
      security: []
  /api/v1/auth/pairings/{pairing_id}/approve:
    post:
      operationId: approvePairing
      tags:
      - auth
      summary: approvePairing
      description: ''
      responses:
        '200':
          description: Poprawna odpowiedź
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pairing'
        default:
          description: Kontrolowany błąd; szczegóły w katalogu kodów
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - $ref: '#/components/parameters/pairing_id'
      - $ref: '#/components/parameters/CSRF'
  /api/v1/auth/pairings/{pairing_id}/deny:
    post:
      operationId: denyPairing
      tags:
      - auth
      summary: denyPairing
      description: ''
      responses:
        '200':
          description: Poprawna odpowiedź
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pairing'
        default:
          description: Kontrolowany błąd; szczegóły w katalogu kodów
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - $ref: '#/components/parameters/pairing_id'
      - $ref: '#/components/parameters/CSRF'
  /api/v1/auth/sessions:
    get:
      operationId: listSessions
      tags:
      - auth
      summary: listSessions
      description: ''
      responses:
        '200':
          description: Poprawna odpowiedź
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sessions'
        default:
          description: Kontrolowany błąd; szczegóły w katalogu kodów
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/auth/sessions/{session_id}:
    delete:
      operationId: revokeSession
      tags:
      - auth
      summary: revokeSession
      description: Idempotentne odwołanie, zamyka SSE. Brak domenowego request journal.
      responses:
        '200':
          description: Poprawna odpowiedź
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        default:
          description: Kontrolowany błąd; szczegóły w katalogu kodów
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - $ref: '#/components/parameters/session_id'
      - $ref: '#/components/parameters/CSRF'
  /api/v1/auth/logout:
    post:
      operationId: logout
      tags:
      - auth
      summary: logout
      description: Unieważnia bieżącą sesję i usuwa cookie.
      responses:
        '200':
          description: Poprawna odpowiedź
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        default:
          description: Kontrolowany błąd; szczegóły w katalogu kodów
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - $ref: '#/components/parameters/CSRF'
  /api/v1/roots:
    get:
      operationId: listRegistrationRoots
      tags:
      - registration
      summary: listRegistrationRoots
      description: ''
      responses:
        '200':
          description: Poprawna odpowiedź
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Roots'
        default:
          description: Kontrolowany błąd; szczegóły w katalogu kodów
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/roots/{root_id}/directories:
    get:
      operationId: listDirectories
      tags:
      - registration
      summary: listDirectories
      description: ''
      responses:
        '200':
          description: Poprawna odpowiedź
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectoryPage'
        default:
          description: Kontrolowany błąd; szczegóły w katalogu kodów
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - $ref: '#/components/parameters/root_id'
      - name: relative_path
        in: query
        schema:
          type: string
          minLength: 0
          maxLength: 4096
      - $ref: '#/components/parameters/Cursor'
  /api/v1/registration-plans:
    post:
      operationId: planRegistration
      tags:
      - registration
      summary: planRegistration
      description: Nie modyfikuje repo; plan wygasa po 5 min. Wymaga CSRF.
      responses:
        '200':
          description: Poprawna odpowiedź
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationPlan'
        default:
          description: Kontrolowany błąd; szczegóły w katalogu kodów
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationPlanInput'
  /api/v1/registrations:
    post:
      operationId: commitRegistration
      tags:
      - registration
      summary: commitRegistration
      description: ''
      responses:
        '202':
          description: Poprawna odpowiedź
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Accepted'
        default:
          description: Kontrolowany błąd; szczegóły w katalogu kodów
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409': &id001
          description: Konflikt domeny/epoki/źródła
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '410': &id002
          description: Wygasły wynik lub okno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422': &id003
          description: Błąd walidacji
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503': &id004
          description: Usługa/zasób niedostępny
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '507': &id005
          description: Błąd storage
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - $ref: '#/components/parameters/RequestID'
      - $ref: '#/components/parameters/CommandEpoch'
      - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationCommit'
  /api/v1/jobs/{job_id}:
    get:
      operationId: getJob
      tags:
      - system
      summary: getJob
      description: ''
      responses:
        '200':
          description: Poprawna odpowiedź
          content:
            application/json:
