          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - $ref: '#/components/parameters/project_id'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - name: status
        in: query
        schema:
          type: string
          minLength: 1
          maxLength: 120
      - name: priority
        in: query
        schema:
          type: string
          minLength: 1
          maxLength: 120
      - name: label
        in: query
        schema:
          type: string
          minLength: 1
          maxLength: 120
      - name: milestone_id
        in: query
        schema:
          type: string
          minLength: 1
          maxLength: 120
      - name: archived
        in: query
        schema:
          type: boolean
          default: false
    post:
      operationId: createCard
      tags:
      - cards
      summary: createCard
      description: ''
      responses:
        '201':
          description: Poprawna odpowiedź
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResponse'
        default:
          description: Kontrolowany błąd; szczegóły w katalogu kodów
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409': *id001
        '410': *id002
        '422': *id003
        '503': *id004
        '507': *id005
      parameters:
      - $ref: '#/components/parameters/project_id'
      - $ref: '#/components/parameters/RequestID'
      - $ref: '#/components/parameters/CommandEpoch'
      - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardCreate'
